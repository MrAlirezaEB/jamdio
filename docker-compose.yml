services:
  # ---- PHP-FPM application -------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file: .env
    environment:
      JAMDIO_ROLE: app
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks: [jamdio]

  # ---- Nginx web server ----------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [jamdio]

  # ---- MySQL ---------------------------------------------------------------
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-jamdio}
      MYSQL_USER: ${DB_USERNAME:-jamdio}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "33060:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [jamdio]

  # ---- Laravel Reverb (WebSockets) ----------------------------------------
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    environment:
      JAMDIO_ROLE: reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    # Realtime dies silently if this exits, so always bring it back.
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    depends_on: [app]
    networks: [jamdio]

  # ---- Queue worker (broadcasts, etc.) ------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    environment:
      JAMDIO_ROLE: worker
    command: php artisan queue:work --tries=3 --timeout=90
    # Broadcasts (queue/now-playing UI updates) run through this worker. If it
    # crashes and stays down, the whole realtime UI silently stops updating —
    # so always restart it.
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks: [jamdio]

  # ---- Vite dev server (frontend assets) ----------------------------------
  node:
    image: node:24-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
    networks: [jamdio]

  # ---- Icecast streaming server -------------------------------------------
  icecast:
    build:
      context: .
      dockerfile: docker/icecast/Dockerfile
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:-hackme}
      ICECAST_MOUNT: ${ICECAST_MOUNT:-/stream}
    ports:
      - "8001:8000"
    networks: [jamdio]

  # ---- Liquidsoap audio engine --------------------------------------------
  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    command: liquidsoap /radio.liq
    environment:
      JAMDIO_API_BASE: http://nginx
      LIQUIDSOAP_API_TOKEN: ${LIQUIDSOAP_API_TOKEN:-liquidsoap-internal-token}
      LIQUIDSOAP_FALLBACK_DIR: /srv/fallback
      ICECAST_HOST: ${ICECAST_HOST:-icecast}
      ICECAST_PORT: "8000"
      ICECAST_MOUNT: ${ICECAST_MOUNT:-/stream}
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
    volumes:
      - ./docker/liquidsoap/radio.liq:/radio.liq:ro
      - ./docker/fallback:/srv/fallback
      # Shared with the app so Liquidsoap can read uploaded tracks by the
      # same absolute path Laravel reports from /api/next-track.
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    depends_on: [icecast, nginx]
    networks: [jamdio]

volumes:
  mysql-data:

networks:
  jamdio:
    driver: bridge
